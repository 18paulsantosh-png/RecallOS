<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RecallOS</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>RecallOS</h1>
    <p>Upload what you want remembered. Ask for it back in plain language.</p>
  </header>

  <div class="card">
    <div class="card-head">
      <h2>Settings</h2>
      <button class="link-btn" id="settingsToggle">edit</button>
    </div>
    <div id="settingsBody">
      <label class="field-label">AI provider</label>
      <select id="provider">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="custom">Custom backend</option>
      </select>

      <div id="apiKeyRow">
        <label class="field-label">API key</label>
        <input type="password" id="apiKey" placeholder="Paste your API key">
      </div>

      <div id="endpointRow" style="display:none;">
        <label class="field-label">Backend URL</label>
        <input type="text" id="endpoint" placeholder="https://your-backend.example.com">
      </div>

      <button class="primary-btn" id="saveSettings">Save</button>
      <div class="status" id="settingsStatus"></div>
    </div>
  </div>

  <div class="card">
    <h2>Upload</h2>
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.txt,.md">
      Drop files here, or click to choose — text files are read as context; PDF/image names are stored for reference
    </label>
    <div class="chips" id="chips"></div>
  </div>

  <div class="card">
    <h2>Ask</h2>
    <div class="ask-row">
      <input type="text" id="question" placeholder="e.g. When did Rahul say the project is due?">
      <button class="primary-btn" id="askBtn">Ask</button>
    </div>
    <div class="status" id="status"></div>
  </div>

  <div class="card result" id="result">
    <div class="q-label">QUESTION</div>
    <div class="q-text" id="qText"></div>
    <div class="a-label">ANSWER</div>
    <div class="a-text" id="aText"></div>
    <div class="s-label">SOURCES</div>
    <ul class="sources" id="sources"></ul>
  </div>

  <footer>RecallOS — hackathon build</footer>
</div>

<script src="js/app.js"></script>
</body>
</html>
